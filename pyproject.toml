[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "fraudwatch"
version = "0.1.0"
description = "Real-time fraud detection: streaming features with point-in-time training, LightGBM, MLflow registry, shadow deployment and drift-triggered retraining."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "bharat-sing-h" }]
keywords = ["fraud-detection", "mlops", "feature-store", "kafka", "lightgbm", "mlflow"]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "mlflow>=2.14",
  "pydantic>=2.6",
  "typer>=0.12",
  "rich>=13.7",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "prometheus-client>=0.20",
  "redis>=5.0",
]

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.4"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "fakeredis>=2.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
]

[project.scripts]
fw = "fraudwatch.cli:app"

[project.urls]
Repository = "https://github.com/bharat-sing-h/fraudwatch-rt"

[tool.hatch.build.targets.wheel]
packages = ["src/fraudwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
filterwarnings = ["ignore::UserWarning:mlflow.*", "ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["fraudwatch"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "pragma: no cover"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
packages = ["fraudwatch"]

[[tool.mypy.overrides]]
# Data/ML libraries are typed as Any at the boundary: pandas/numpy stubs can't express
# "this DataFrame column holds ints", so they'd demand casts on every row access.
module = ["pandas.*", "numpy.*", "lightgbm.*", "mlflow.*", "sklearn.*", "confluent_kafka.*", "redis.*", "fakeredis.*",
          "prometheus_client.*", "pyarrow.*"]
follow_imports = "skip"
ignore_missing_imports = true
