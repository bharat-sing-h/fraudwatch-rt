name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}", cache: pip}
      - run: pip install -e ".[dev,kafka]"
      - run: pytest --cov --cov-report=term-missing --cov-fail-under=90

  # The whole system in Docker: Redpanda, Redis, MLflow, bootstrap training, API, stream
  # worker. Then real traffic is pushed through Kafka and through HTTP.
  compose-e2e:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose -f deploy/docker-compose.yml up -d --build --wait --wait-timeout 600 api worker
      - name: Score a transaction over HTTP
        run: |
          curl -fsS localhost:8080/v1/model
          curl -fsS -X POST localhost:8080/v1/score -H 'content-type: application/json' \
            -d '{"tx_id": 1, "customer_id": 42, "terminal_id": 7, "amount": 499.0, "ts": 1741737600}' | tee /tmp/score.json
          grep -q '"decision"' /tmp/score.json
      - name: Stream 3000 events through Kafka
        run: |
          docker compose -f deploy/docker-compose.yml run --rm replay fw replay --data data --start-day 70 --limit 3000
          for i in $(seq 1 60); do
            n=$(docker compose -f deploy/docker-compose.yml exec -T redpanda rpk topic describe decisions -p 2>/dev/null | awk 'NR>1 {s+=$NF} END {print s+0}')
            echo "decisions so far: $n"; [ "$n" -ge 3000 ] && exit 0; sleep 5
          done
          exit 1
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --tail 200
